---
name: Push to DockerHub & GHCR

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from'
        required: false
        type: string
      version:
        description: 'Binary version (release tag)'
        required: true
        type: string
        default: 'latest'
      docker_tag:
        description: 'Docker image version (tag)'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish the Docker image'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Binary version (release tag)'
        required: true
        type: string
        default: 'latest'
      docker_tag:
        description: 'Docker image version (tag)'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish the Docker image'
        required: false
        type: boolean
        default: true

env:
  DOCKERHUB_REPO: germainlefebvre4/cvwonder
  GHCR_REPO: ghcr.io/germainlefebvre4/cvwonder
  PLATFORMS: linux/amd64,linux/arm64/v8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set versions
        id: versions
        shell: bash
        env:
          # Inputs are passed through the environment, never interpolated into the script.
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DOCKER_TAG: ${{ inputs.docker_tag }}
        run: |
          set -euo pipefail

          version="$INPUT_VERSION"
          docker_tag="$INPUT_DOCKER_TAG"

          # Refuse anything that is not a plain tag / version string
          for value in "$version" "$docker_tag"; do
            if [[ -n "$value" && ! "$value" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid input value: '$value'"
              exit 1
            fi
          done

          # Use docker_tag if provided, otherwise fall back to version
          if [ -z "$docker_tag" ]; then
            docker_tag="$version"
          fi

          # Normalize docker_tag: add 'v' prefix if in format X.Y.Z
          if [[ $docker_tag =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            docker_tag="v$docker_tag"
          fi

          # Floating tags (vX.Y, vX, latest) only move for stable releases (vX.Y.Z).
          # A pre-release such as v1.2.3-rc.1 only publishes its own tag.
          tag_names=("$docker_tag")
          if [[ $docker_tag =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tag_names+=("v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "v${BASH_REMATCH[1]}" "latest")
          fi

          # Version stamped in the binary. The Dockerfile prefixes numeric versions
          # with 'v'; compute the value `cvwonder version` must report.
          if [[ ${version#v} =~ ^[0-9] ]]; then
            expected_version="v${version#v}"
          else
            expected_version="$version"
          fi

          {
            echo "DOCKER_TAG=$docker_tag"
            echo "CVWONDER_VERSION=$version"
            echo "EXPECTED_VERSION=$expected_version"
            echo "TAGS<<EOF_TAGS"
            for repo in "$DOCKERHUB_REPO" "$GHCR_REPO"; do
              for tag in "${tag_names[@]}"; do
                echo "$repo:$tag"
              done
            done
            echo "EOF_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ env.PLATFORMS }}
          load: true
          push: ${{ inputs.publish }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CVWONDER_VERSION=${{ steps.versions.outputs.CVWONDER_VERSION }}
          tags: ${{ steps.versions.outputs.TAGS }}

      - name: Export digest
        if: ${{ inputs.publish }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Validate image integrity
        env:
          IMAGE: ${{ env.DOCKERHUB_REPO }}:${{ steps.versions.outputs.DOCKER_TAG }}
          EXPECTED_VERSION: ${{ steps.versions.outputs.EXPECTED_VERSION }}
        run: |
          output="$(docker run --rm "$IMAGE" version 2>&1)"
          echo "$output"
          if ! grep -qxF "Version: $EXPECTED_VERSION" <<< "$output"; then
            echo "::error::Image reports an unexpected version (expected '$EXPECTED_VERSION')"
            exit 1
          fi

      - name: Upload digest
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: digests
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Docker Hub Description
        if: ${{ inputs.publish }}
        uses: peter-evans/dockerhub-description@v5
        with:
          repository: ${{ env.DOCKERHUB_REPO }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./docs/dockerhub/README.md
