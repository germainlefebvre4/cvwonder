name: Docs
on:
  pull_request:
    paths:
      - 'docs/github-pages/**'
      - 'cmd/**'
      - '.github/workflows/docs.yml'

jobs:
  docs:
    name: Build and check documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/github-pages/.node-version
          check-latest: true
          cache: npm
          cache-dependency-path: docs/github-pages/package-lock.json

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        working-directory: docs/github-pages
        run: npm ci

      - name: Build site (validates internal links)
        working-directory: docs/github-pages
        run: npm run build

      - name: Check legacy redirects
        working-directory: docs/github-pages
        run: npm run check:redirects

      - name: Check accent contrast
        working-directory: docs/github-pages
        run: npm run check:contrast

      - name: Validate the example CV
        run: go run ./cmd/cvwonder validate --input docs/github-pages/src/examples/cv.yml
