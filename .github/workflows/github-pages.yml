---
name: GitHub Pages
on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/github-pages/.node-version
          check-latest: true
          cache: npm
          cache-dependency-path: docs/github-pages/package-lock.json

      - name: Build static files
        id: build
        run: |
          cd docs/github-pages/
          npm ci
          npm run build
        env:
          CVWONDER_VERSION: ${{ github.ref_name }}

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/github-pages/dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: docs-production
      url: "https://cvwonder.fr"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
