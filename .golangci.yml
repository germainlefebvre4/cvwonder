version: "2"
run:
  concurrency: 7
  modules-download-mode: mod
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - depguard
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - funlen
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocyclo
    - gosec
    - gosmopolitan
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nilerr
    - nilnesserr
    - noctx
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - zerologlint
  settings:
    depguard:
      rules:
        log:
          list-mode: lax
          deny:
            - pkg: gopkg.in/DataDog/dd-trace-go.v1/internal/log
              desc: use github.com/sirupsen/logrus instead
            - pkg: github.com/bombsimon/logrusr/v2
              desc: use github.com/sirupsen/logrus instead
            - pkg: github.com/opentracing/opentracing-go/log
              desc: use github.com/sirupsen/logrus instead
            - pkg: gopkg.in/DataDog/dd-trace-go.v1/contrib/sirupsen/logrus
              desc: use github.com/sirupsen/logrus instead
        yaml:
          list-mode: lax
          deny:
            - pkg: gopkg.in/yaml.v3
              desc: use github.com/goccy/go-yaml instead
            - pkg: github.com/spf13/viper/internal/encoding/yaml
              desc: use github.com/goccy/go-yaml instead
            - pkg: k8s.io/apimachinery/pkg/util/yaml
              desc: use github.com/goccy/go-yaml instead
    dogsled:
      max-blank-identifiers: 2
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
    funlen:
      lines: 100
      statements: 60
    gocognit:
      min-complexity: 10
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-checks:
        - rangeValCopy
      disabled-checks:
        - regexpMust
      enabled-tags:
        - performance
      disabled-tags:
        - experimental
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - NOTE
        - OPTIMIZE
        - HACK
    govet:
      disable:
        - atomicalign
        - shadow
      enable-all: false
      disable-all: false
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
      ignore-rules:
        - someword
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 4
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx
    testpackage:
      skip-regexp: (export|internal)_test\.go
    unparam:
      check-exported: false
    whitespace:
      multi-if: false
      multi-func: false
    wsl:
      strict-append: true
      allow-assign-and-call: true
      allow-multiline-assign: true
      force-case-trailing-whitespace: 0
      allow-trailing-comment: false
      allow-separated-leading-comment: false
      allow-cuddle-declarations: false
      force-err-cuddling: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - errchkjson
          - funlen
          - goconst
          - gocyclo
          - gosec
          - musttag
          - noctx
        path: .*_test\.go$
      - linters:
          - dupl
          - errcheck
          - errchkjson
          - funlen
          - goconst
          - gocyclo
          - gosec
          - musttag
          - noctx
        path: .*_mock\.go$
      - linters:
          - dupl
          - errcheck
          - errchkjson
          - funlen
          - goconst
          - gocyclo
          - gosec
          - musttag
          - noctx
        path: .*test.*\.go$
      - linters:
          - bodyclose
        path: .*.go$
      - linters:
          - gosec
        path: internal/hmac/
        text: weak cryptographic primitive
      - linters:
          - staticcheck
        text: 'SA9003:'
      - linters:
          - staticcheck
        text: 'G601:'
      - linters:
          - lll
        source: '^//go:generate '
      - path: (.+)\.go$
        text: abcdef
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - .*_test\.go$
      - .*_mock\.go$
      - .*test.*\.go$
